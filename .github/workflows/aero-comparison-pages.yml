name: Publish Aerodrome comparison

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/aero-comparison-pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: aero-comparison-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout comparison site
        uses: actions/checkout@v4
        with:
          ref: aero-v2-v3-table

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload site
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./aero-v2-v3

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
